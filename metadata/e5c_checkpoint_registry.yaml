selection_rule:
  step_1: eligible = synthetic_gate.pass AND retention RT1 AND RT2
  step_2: among eligible, rank by PBE on the FULL E5c validation pool
  step_3: tie range = within 10 % of the best → prefer the training size whose seeds
    are most stable (smallest coefficient of variation of validation-pool PBE across
    its seeds; single-seed sizes rank after multi-seed sizes), then the smaller N,
    then the lower validation PBE
  fallback_if_none_eligible: rank ALL fine-tuned runs by the number of the 13 criteria
    passed (ST1–5, RS1–2 × 3 probe types, RT1–2), then validation-pool PBE; the selection
    is FLAGGED and the verdict is at most E5C-C
  then: FREEZE (sha256 weights + normalizer + configs + selection table) in metadata/e5c_checkpoint_registry.yaml
    and COMMIT before any real-state file is opened
