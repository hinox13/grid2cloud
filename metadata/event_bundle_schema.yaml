# Cloud2Grid event bundle — schema SPECIFICATION. Built by scripts/build_demo_events.py, read by
# the Cloud2Grid Explorer (demo/streamlit_app.py).
#
# One bundle = one meteorological event replayed on one study network (README §33–35, §41).
# The future app reads ONLY bundles (no raw satellite files, no live compute).
# Every value carries a provenance class: OBSERVED | DERIVED | SIMULATED | PREDICTED.
# Node/branch identifiers are the licence-area-scoped keys used by E1 (e.g. "EPN:SUND31",
# "T1:2018"); unlocated nodes keep geolocation_status: unresolved (render schematically).

schema_version: 0.3   # 0.2 (E3 ingestion): fields produced by the satellite pipeline
# 0.3 (demo): generic multi-model bundles. genco/errors/summary tables carry a `model` key, so
# a bundle holds AC plus ANY number of frozen models (zero_shot, E5, E5b, E5c, ...); branch
# states are stored per GENCO bus pair (parallel circuits grouped, as GENCO sees them); grid
# states are half-hourly (S1), satellite/PV 15-minute; global tables live in data/demo/.
layout:
  event_<id>/:
    metadata.json: event
    attribution.json: attribution
    satellite/frame_<k>.webp: satellite_frame
    irradiance.parquet: irradiance_by_asset
    pv_generation.parquet: pv_by_asset
    pv_by_bus.parquet: pv_by_bus
    loads.parquet: loads
    ac_reference.parquet: ac_state
    satellite/frames.parquet: satellite_frame          # frame index (0.3)
    fleet_pv.parquet: fleet_pv                          # 15-min fleet total (0.3)
    ac_reference_branches.parquet: ac_branch_state      # (0.3)
    genco.parquet: genco_state                          # bus rows, `model` column (0.3)
    genco_branches.parquet: genco_branch_state          # branch rows, `model` column (0.3)
    errors.parquet: error_state                         # `model` column (0.3)
    summary.parquet: grid_summary                       # per grid slot × model (0.3)
    assets.parquet: pv_assets                           # id, capacity, location only (0.3)
    network_nodes.parquet: network_nodes
    network_edges.parquet: network_edges

tables:
  event:
    fields:
      event_id: {type: str}
      network_config: {type: str, example: configs/networks/sundon_base_ltds.yaml}
      network_variant: {type: str, example: sundon_capacity_scaled_with_outages}
      event_class: {type: str, enum: [A_clear_sky_control, B_fast_ramp, C_broken_cloud, D_coherent_transition, E_overcast_control], note: "configs/experiments/e3_event_discovery.yaml (pre-registered)"}
      selection_config_hash: {type: str, note: "scripts/discover_weather_events.py config_hash"}
      satellite_product_version: {type: str, note: "MDSSFTD global attribute algorithm_version"}
      active_pv_capacity_mw: {type: float, note: "historically active capacity at the event (solar.capacity)"}
      selection_criteria: {type: dict, note: "meteorological/grid-independent only (README §18); never GENCO error"}
      time_start_utc: {type: datetime}
      time_end_utc: {type: datetime}
      step_minutes: {type: int, example: 15}
      split: {type: str, enum: [train, validation, test], note: "event-block split (README §24)"}
      git_commit: {type: str}
      source_hashes: {type: dict, note: "sha256 of every input file (metadata/provenance.json)"}
      genco_checkpoint: {type: str}

  attribution:
    fields:
      sources: {type: "list[dict]", note: "source_id, attribution text, licence URL, 'modified' notice — generated by cloud2grid.licensing.attribution_block"}
      gate_decisions: {type: "list[dict]", note: "licence-gate result for redistribute_derived per source"}

  satellite_frame:
    provenance: OBSERVED (imagery) — Advanced Image Product, CC BY 4.0
    fields:
      timestamp_utc: {type: datetime, note: "nominal SEVIRI slot = the MDSSFTD slot it is paired with"}
      served_time_utc: {type: datetime, note: "from the WMS 'Nearest value used' header — never inferred"}
      radiation_slot_utc: {type: datetime}
      time_delta_min: {type: float, note: "rejected if > configs/data/eumetsat.yaml matching.max_delta_min"}
      product: {type: str, enum: ["EO:EUM:DAT:MSG:EVIEW", "EO:EUM:DAT:MSG:NCL_ENH"], note: "hero layer: EVIEW (reports/e3_satellite_ingestion.md)"}
      image_file: {type: str, example: satellite/frame_000.webp}
      bbox_wgs84: {type: "[lon_min, lat_min, lon_max, lat_max]"}
      crs: {type: str, example: "EPSG:4326 (reprojected for display)"}
      source_product_id: {type: str}

  irradiance_by_asset:
    provenance: DERIVED (LSA SAF MDSSFTD satellite retrieval sampled at asset location)
    key: [timestamp_utc, asset_id]
    fields:
      acquisition_time_utc: {type: datetime, note: "slot + line acquisition offset (PUM §6.3)"}
      ghi_wm2: {type: float}
      dhi_wm2: {type: float}
      dni_wm2: {type: float, note: "closure DNI = (GHI − DHI)/cos θz with pvlib physical limits"}
      clearsky_index: {type: float}
      quality_flag: {type: int, note: "raw MDSSFTD bitfield (PUM Table 4)"}
      quality_status: {type: str, enum: [GOOD, LOW_QUALITY, NIGHT, INVALID, MISSING, OUT_OF_RANGE]}
      pixel_id: {type: str, note: "0.05° NetCDF cell used — several assets may share one"}
      native_pixel_id: {type: str, note: "native SEVIRI pixel — the true independence unit"}

  pv_by_asset:
    provenance: DERIVED (satellite-driven ESTIMATED PV generation; never "measured", README §13)
    key: [timestamp_utc, asset_id]
    fields:
      asset_id: {type: str, note: "ECR register + row; no customer fields"}
      node_key: {type: str}
      capacity_mw: {type: float, note: "historically ACTIVE capacity at timestamp (0 if not yet connected)"}
      capacity_factor: {type: float}
      p_mw: {type: float}
      quality_status: {type: str}
      model_assumptions_ref: {type: str, note: "pointer to documented tilt/azimuth/technology assumptions"}

  pv_by_bus:
    provenance: DERIVED
    key: [timestamp_utc, node_key]
    fields:
      p_mw: {type: float, note: "NaN if any active contributing asset lacks a usable value"}
      active_solar_capacity_mw: {type: float}
      n_assets: {type: int}
      quality: {type: str, note: "worst status among active contributing assets"}

  loads:
    provenance: "OBSERVED or DERIVED per node (E1 §5)"
    key: [timestamp_utc, node_key]
    fields:
      p_mw: {type: float}
      q_mvar: {type: float}
      class: {type: str, enum: [OBSERVED, DERIVED, ASSUMED]}

  ac_state:
    provenance: SIMULATED (AC power flow — pandapower or datakit/PowerModels)
    key: [timestamp_utc, element_id]
    fields:
      element_type: {type: str, enum: [bus, line, trafo]}
      vm_pu: {type: float, applies_to: bus}
      va_deg: {type: float, applies_to: bus}
      p_from_mw: {type: float, applies_to: [line, trafo]}
      q_from_mvar: {type: float, applies_to: [line, trafo]}
      loading_pct: {type: float, applies_to: [line, trafo]}
      converged: {type: bool}

  genco_state:
    provenance: PREDICTED (GENCO)
    key: [timestamp_utc, model, bus]
    fields:
      model: {type: str, note: "id from data/demo/models.json (0.3); AC rows live in ac_reference"}
      vm_pu: {type: float}
      va_deg: {type: float}
      p_inj_mw: {type: float, note: "Pg − Pd (net injection)"}
      q_inj_mvar: {type: float}
      residual_p_mw: {type: float, note: "GENCO active power-balance residual"}

  ac_branch_state / genco_branch_state:
    provenance: "SIMULATED (AC) / PREDICTED (GENCO)"
    key: [timestamp_utc, model, branch_id]
    fields:
      branch_id: {type: str, note: "'<bus_a>-<bus_b>' GENCO bus pair, bus_a < bus_b"}
      p_ab_mw: {type: float, note: "active power leaving bus_a toward bus_b (parallel circuits summed)"}
      q_ab_mvar: {type: float}
      p_ba_mw: {type: float}
      s_max_mva: {type: float}
      loading_pct: {type: float, note: "100 × max sending-end |S| / LTDS rating of the pair"}
      losses_mw: {type: float}

  grid_summary:
    key: [timestamp_utc, model]
    fields:
      import_mw: {type: float, note: "REF-bus Pg = grid import at the Sundon 132 kV supply"}
      max_loading_pct: {type: float}
      PBE_mean: {type: float}
      P_residual: {type: float}
      V_error: {type: float}
      angle_error: {type: float}
      branch_P_error: {type: float}
      max_loading_error: {type: float}
      fleet_pv_mw: {type: float}
      p_hv_injected_mw: {type: float}
      load_p_mw: {type: float}

  error_state:
    provenance: DERIVED (GENCO − AC)
    key: [timestamp_utc, element_id]
    fields:
      dvm_pu: {type: float}
      dva_deg: {type: float}
      model: {type: str}
      element_type: {type: str, enum: [bus, branch]}
      dp_mw: {type: float}
      dloading_pct: {type: float, applies_to: branch}
      residual_p_mw: {type: float, note: "GENCO power-balance residual at bus"}
      scenario_family: {type: str, enum: [S0, S1, S2, S3, S4], note: "README §17"}

  network_nodes:
    fields:
      node_key: {type: str}
      vn_kv: {type: float}
      lat: {type: "float | null"}
      lon: {type: "float | null"}
      geolocation_status: {type: str, enum: [resolved, ambiguous, unresolved]}
      schematic_x: {type: float}
      schematic_y: {type: float}

  network_edges:
    fields:
      branch_id: {type: str}
      from_node: {type: str}
      to_node: {type: str}
      kind: {type: str, enum: [line, trafo]}
      metered: {type: str, enum: [active_power, current_only, none]}
