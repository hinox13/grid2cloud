    redistribution_allowed: null
    derivatives_allowed: null
    attribution_required: null
    attribution: null
    raw_data_committed: false
    licence_verified: null
    notes: >-
      Challenge rules/context only, not a data source. Rules state submissions must use GENCO and
      the OpenGridFM toolkits; deadline 25 Oct 2026 (AoE). Nothing from this page is redistributed.

