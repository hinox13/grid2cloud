  # ---------------------------------------------------------------------------- EUMETSAT
  eumetsat_eview:
    kind: dataset
    provider: EUMETSAT
    name: "European HRV RGB - 0 degree (E-View)"
    identifier: "EO:EUM:DAT:MSG:EVIEW"
    source_url: https://user.eumetsat.int/catalogue/EO%3AEUM%3ADAT%3AMSG%3AEVIEW
    documentation_url: https://api.eumetsat.int/data/browse/collections/EO%3AEUM%3ADAT%3AMSG%3AEVIEW?format=json
    licence: CC-BY-4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    licence_evidence: >-
      EUMETSAT Data Policy ("Last amended on 01 January 2025"; PDF
      https://www-cdn.eumetsat.int/files/2025-02/45173%20-%20Data_Policy(1442019%20V1).pdf,
      sha256 7198d34b3818af972b35053c7bda44b001369f37d232c5e8d34ee2bc7d5859c3):
      Annex I lists "All SEVIRI, FCI, IRS and LI Advanced Image Products" as "Core"; Annex II
      defines an Advanced Image Product as "the combination of different channels allocating a
      colour to each channel (i.e. RGB) … do not contain the original numerical data";
      Art. 5.1: Core access is "Free and Unrestricted basis under a CC-BY-4.0 licence,
      regardless of when and how these are made available"; Art. 6.1: "Users may redistribute
      all Core Data and Products"; Art. 6.3 attribution wording. The Data Store collection
      abstract confirms this collection is an RGB composite of SEVIRI channels, and its
      `rights: NoConditions` is consistent with "Free and Unrestricted". Abstract: "an RGB (Red, Green, Blue) composite based upon data from the
      SEVIRI instrument … HRV channel combined with … IR10.8".
    redistribution_allowed: true
    derivatives_allowed: true
    attribution_required: true
    attribution: >-
      "Contains modified EUMETSAT Meteosat data [year]" (EUMETSAT Data Policy Art. 6.3, adapted:
      E-View / European HRV RGB, EO:EUM:DAT:MSG:EVIEW).
    raw_data_committed: false
    licence_verified: "2026-10-02"
    notes: >-
      Visual layer candidate. Previously UNVERIFIED (2 Oct 2026, Phase 0): resolved in E3 prep
      from the authoritative Data Policy classification, not from the README example.
      Access (corrected 2 Oct 2026, E3 satellite ingestion): the catalogue record
      (https://user.eumetsat.int/catalogue/es/csw/_doc/EO:EUM:DAT:MSG:EVIEW, digitalTransfers)
      lists a single distribution channel, EUMETView (WMS layer msg_fes:rgb_eview; GeoTIFF),
      with dataPolicies "Free and unrestricted - CC-BY-4.0"; the Data Store OpenSearch returns
      "Not found" for the collection. EUMETView WMS is anonymous — no credentials needed. The
      earlier note that Data Store API credentials are required was wrong.

  eumetsat_ncl_enh:
    kind: dataset
    provider: EUMETSAT
    name: "Natural Colour Enhanced RGB - MSG - 0 degree"
    identifier: "EO:EUM:DAT:MSG:NCL_ENH"
    source_url: https://user.eumetsat.int/catalogue/EO%3AEUM%3ADAT%3AMSG%3ANCL_ENH
    documentation_url: https://api.eumetsat.int/data/browse/collections/EO%3AEUM%3ADAT%3AMSG%3ANCL_ENH?format=json
    licence: CC-BY-4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    licence_evidence: >-
      EUMETSAT Data Policy ("Last amended on 01 January 2025"; PDF
      https://www-cdn.eumetsat.int/files/2025-02/45173%20-%20Data_Policy(1442019%20V1).pdf,
      sha256 7198d34b3818af972b35053c7bda44b001369f37d232c5e8d34ee2bc7d5859c3):
      Annex I lists "All SEVIRI, FCI, IRS and LI Advanced Image Products" as "Core"; Annex II
      defines an Advanced Image Product as "the combination of different channels allocating a
      colour to each channel (i.e. RGB) … do not contain the original numerical data";
      Art. 5.1: Core access is "Free and Unrestricted basis under a CC-BY-4.0 licence,
      regardless of when and how these are made available"; Art. 6.1: "Users may redistribute
      all Core Data and Products"; Art. 6.3 attribution wording. The Data Store collection
      abstract confirms this collection is an RGB composite of SEVIRI channels, and its
      `rights: NoConditions` is consistent with "Free and Unrestricted". Abstract: "an RGB which utilises three SEVIRI solar channels: NIR1.6, VIS0.8
      and VIS0.6".
    redistribution_allowed: true
    derivatives_allowed: true
    attribution_required: true
    attribution: >-
      "Contains modified EUMETSAT Meteosat data [year]" (EUMETSAT Data Policy Art. 6.3, adapted:
      Natural Colour Enhanced RGB, EO:EUM:DAT:MSG:NCL_ENH).
    raw_data_committed: false
    licence_verified: "2026-10-02"
    notes: >-
      Alternative visual layer (solar channels only: daytime imagery). Access as for
      eumetsat_eview: EUMETView only (WMS layer msg_fes:rgb_naturalenhncd), anonymous; catalogue
      dataPolicies "Free and unrestricted - CC-BY-4.0" (read 2 Oct 2026).

  # ----------------------------------------------------------------------------- LSA SAF
  lsa_saf_mdssftd:
    kind: dataset
    provider: EUMETSAT LSA SAF
    name: "MSG Total and Diffuse Downward Surface Shortwave Flux (MDSSFTD)"
    identifier: "LSA-207"
    source_url: https://lsa-saf.eumetsat.int/en/data/products/radiation/
    documentation_url: https://lsa-saf.eumetsat.int/en/data/data-access/
    licence: CC-BY-4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    licence_evidence: >-
      LSA SAF "Data usage policy and acknowledgement" (re-read 2026-10-02): "The LSA SAF
      products are licensed under the Creative Commons Attribution 4.0 International License
      (CC BY 4.0) by EUMETSAT … You may share … and adapt … for any purpose, even
      commercially. You must provide attribution and cannot apply additional restrictions."
      Corroborated by the EUMETSAT Data Policy (amended 2025-01-01), Annex I: all SEVIRI
      Derived Products — which per Annex II include all products generated by the SAFs — are
      "Core" (Art. 5.1: CC-BY-4.0; Art. 6.1: redistribution allowed).
    redistribution_allowed: true
    derivatives_allowed: true
    attribution_required: true
    attribution: >-
      Figures: "EUMETSAT LSA SAF [MDSSFTD, LSA-207]". Text: "Data source: EUMETSAT LSA SAF, MSG
      Total and Diffuse Downward Surface Shortwave Flux, MDSSFTD, LSA-207." Papers: cite Carrer
      et al. (2019a, Remote Sens. 11, 2532; 2019b, Remote Sens. 11, 2630) and Trigo et al. (2011).
    raw_data_committed: false
    licence_verified: "2026-10-02"
    notes: >-
      Primary quantitative satellite forcing. Archive verified available 2004-2026 in NetCDF and
      HDF5 under https://datalsasaf.lsasvcs.ipma.pt/PRODUCTS/MSG/MDSSFTD/ (all 12 months of
      2024 listed). Access: "restricted to registered users" (free signup at
      https://mokey.lsasvcs.ipma.pt/auth/signup), HTTP basic auth; THREDDS/OpenDAP allows
      server-side spatial subsetting. Not downloaded yet.

  lsa_saf_msg_static:
    kind: dataset
    provider: EUMETSAT LSA SAF
    name: "LSA SAF MSG static data: native-grid latitude/longitude and land/water mask"
    identifier: "hdf5_lsasaf_msg_lat/lon_msg-disk; NETCDF_LSASAF_USGS-IGBP_LWMASK_MSG-Disk"
    source_url: https://nextcloud.lsasvcs.ipma.pt/s/JasGNSPSTms4Gsi
    documentation_url: https://datalsasaf.lsasvcs.ipma.pt/PRODUCTS/MSG/MDSSFTD/Readme.md
    licence: CC-BY-4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    licence_evidence: >-
      Distributed by the LSA SAF data service as auxiliary data of its products (linked from
      the MDSSFTD PUM §6.2 and the official tutorials). The LSA SAF data-service README states
      "The LSA SAF products are licensed under the Creative Commons Attribution 4.0
      International License (CC BY 4.0) by EUMETSAT"; EUMETSAT Data Policy Annex I/II classes
      all SAF-generated products as Core (CC-BY-4.0). Used only to verify product geometry;
      the raw files are never redistributed.
    redistribution_allowed: true
    derivatives_allowed: true
    attribution_required: true
    attribution: >-
      "EUMETSAT LSA SAF (static MSG grid and land/water mask)".
    raw_data_committed: false
    licence_verified: "2026-10-02"
    notes: >-
      Public Nextcloud shares (no credentials). Native lat/lon at 2-byte precision
      (~1 MB + 2 MB bz2) and the regular-grid NetCDF land/water mask (~0.2 MB).

