    raw_data_committed: false
    licence_verified: "2026-10-02"
    added_beyond_readme: true
    notes: >-
      Official GENCO checkpoints referenced from the GENCO paper reproduction guide. Needed to run
      the E0 baseline without retraining; README §1 points to gridfm-graphkit for checkpoints and
      these are the checkpoints that library documents.

  genco_pf_transfer_checkpoints:
    kind: model
    provider: GridFM (Hugging Face)
    name: "GENCO transfer checkpoints (subgrid-pretrained model; IEEE 118 zero-shot eval set)"
    identifier: "huggingface.co/gridfm/genco-pf-transfer"
    source_url: https://huggingface.co/gridfm/genco-pf-transfer
    documentation_url: https://github.com/gridfm/gridfm-paper-genco/blob/main/repro_instructions/5.5.3_PF_transfer.md
