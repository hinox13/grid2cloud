# Cloud2Grid — machine-readable source registry.
#
# Canonical entries follow README §1 "Authoritative source registry". Sources added beyond
# that registry are flagged with `added_beyond_readme: true` and justified in `notes`.
#
# Licence fields are fail-closed:
#   - `licence: UNVERIFIED` and `licence_verified: null` whenever the licence could not be
#     confirmed from the authoritative source itself. The licence gate rejects these.
#   - `licence_verified` holds the ISO date on which the licence was confirmed, and
#     `licence_evidence` says exactly where it was read.
#   - `licence` values must match a key in metadata/licence_manifest.yaml.
#
# Per-source flags (`redistribution_allowed`, `derivatives_allowed`) can only *restrict*
# what the licence permits; they never widen it. `null` means "unknown" and is treated as
# "not allowed" by the gate.
#
# Raw third-party data is never committed (README §40): `raw_data_committed` is false for all.

schema_version: 1

sources:

  # --------------------------------------------------------------------- GENCO / OpenGridFM
  genco_paper:
