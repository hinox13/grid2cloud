    redistribution_allowed: true
    derivatives_allowed: true
    attribution_required: true
    attribution: "GENCO transfer checkpoints, gridfm/genco-pf-transfer (Apache-2.0); Puech et al. (2026), arXiv:2608.09921."
    raw_data_committed: false
    licence_verified: "2026-10-06"
    added_beyond_readme: true
    notes: >-
      E4 zero-shot model: `pretraining/best_model_state_dict.pt` (run 1_h_100_32, pretrained on
      100 subgrids), the checkpoint the GENCO paper §5.5.3 evaluates zero-shot on an unseen grid
      (row n_scenarios=0). Also provides the IEEE 118 evaluation set used to reproduce that
      zero-shot number. No normalizer stats are shipped with the pretrained model.

