    source_url: https://arxiv.org/abs/2608.09921
    documentation_url: https://arxiv.org/pdf/2608.09921
    licence: CC-BY-4.0
    licence_url: http://creativecommons.org/licenses/by/4.0/
    licence_evidence: "arXiv abstract page links the CC BY 4.0 licence for this submission."
    redistribution_allowed: true
    derivatives_allowed: true
    attribution_required: true
    attribution: "Puech et al. (2026), GENCO - A Unified Neural Solver Embedded in a Development Framework for Steady-State Grid Analysis, arXiv:2608.09921."
    raw_data_committed: false
    licence_verified: "2026-10-02"
    notes: "Main architectural and scientific reference for GENCO."

  genco_challenge:
