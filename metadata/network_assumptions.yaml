# Cloud2Grid — network modelling assumptions and parameter provenance classes (E1).
#
# Every model parameter is classified as one of:
#   PUBLISHED  read directly from a UKPN dataset field
#   DERIVED    computed deterministically from PUBLISHED values (formula recorded)
#   ASSUMED    a modelling convention, listed below with reason and sensitivity risk
#   MISSING    not published and not filled (the element/quantity is excluded or reported)
#
# The per-element table is generated by scripts/build_network.py:
#   reports/tables/e1_parameter_provenance.csv
# Code refers to the assumption IDs below; changing an assumption means editing this file.

schema_version: 1

parameters:
  circuit_r_x_b:
    class: DERIVED
    from: "LTDS T1 positive_sequence_impedance_{r,x}_percent, susceptance_b_percent (PUBLISHED)"
    formula: "Z_ohm = pct/100 * Vn^2 / S_base; B_S = pct/100 * S_base / Vn^2; per-km = total / circuit_length"
    depends_on: [A01_percent_base_100mva]
  circuit_length:
    class: PUBLISHED
    from: "LTDS T1 circuit_length (km)"
  circuit_rating:
    class: PUBLISHED
    from: "LTDS T1 rating_amps_summer / rating_amps_winter ('Derived Circuit rating' per UKPN)"
    notes: "Summer rating used for loading %; winter recorded. See A08."
  transformer_vk_vkr:
    class: DERIVED
    from: "LTDS T2a positive_sequence_impedance_{r,x}_percent (PUBLISHED)"
    formula: "vk = |R + jX|_pct * Sn / S_base; vkr = R_pct * Sn / S_base (Sn = summer MVA rating)"
    depends_on: [A01_percent_base_100mva]
  transformer_ratio:
    class: PUBLISHED
    from: "LTDS T2a voltage_hv / voltage_lv (rated winding voltages, e.g. 33/11.5 kV)"
    notes: "Off-nominal ratio arises from rated LV voltage vs 11 kV busbar nominal."
  transformer_rating:
    class: PUBLISHED
    from: "LTDS T2a transformer_rating_mva_summer / _winter"
  transformer_tap_range:
    class: PUBLISHED
    from: "LTDS T2a tap_range_min_percent / tap_range_max_percent"
  transformer_tap_position:
    class: ASSUMED
    assumption: A02_neutral_taps
  transformer_no_load_losses:
    class: ASSUMED
    assumption: A03_no_magnetising_branch
  transformer_phase_shift:
    class: ASSUMED
    assumption: A04_zero_phase_shift
  bus_nominal_voltage:
    class: PUBLISHED
    from: "LTDS T1 operating_voltage (132/33 kV buses); transformer monthly index nominal_voltage = 11 kV (primary LV busbars)"
  external_grid:
    class: ASSUMED
    assumption: A05_external_grid_sundon_gis_132kv
  bus_coupler:
    class: ASSUMED
    assumption: A06_sundon_132kv_coupler_closed
  load_active_power:
    class: "OBSERVED or DERIVED (per node, see configs/networks/sundon_base_ltds.yaml)"
  load_reactive_power:
    class: DERIVED
    assumption: A07_load_power_factor_ltds_3a
  unobserved_33kv_customers:
    class: "MISSING (V0) or DERIVED (V1 residual)"
    assumption: A09_unobserved_customer_injection
  pv_injection:
    class: "MISSING (not modelled separately in E1/E2)"
    notes: "Embedded generation below primaries is netted inside the OBSERVED primary-transformer flows. 33 kV-connected generators/storage are unobserved, see A09."
  geography:
    class: "PUBLISHED (site coordinates via FLOC) or MISSING"
    notes: "Unlocated nodes keep geolocation_status: unresolved. No interpolation."

assumptions:
  A01_percent_base_100mva:
    assumed: "LTDS percent impedances/susceptances are on a 100 MVA base at the element's nominal voltage."
    why: >-
      Not stated in the UKPN datasets or ukpyn docs. 100 MVA is the Ofgem LTDS Form of
      Statement convention. Plausibility checks on Sundon: 33 kV circuits give R,X ≈ 0.09 Ω/km
      and C ≈ 0.45 µF/km (typical 33 kV cable); 33/11 kV 18 MVA units give X ≈ 17% on own
      rating and 132/33 kV 90 MVA units ≈ 23% (typical). On an own-rating base the primary
      transformers would have X ≈ 94%, which is not physical.
    affects: "all circuits and transformers"
    sensitivity_risk: >-
      HIGH if wrong (every impedance scales). Mitigated by the plausibility checks above and by
      E2 parallel-path flow sharing, which depends on impedance RATIOS.

  A02_neutral_taps:
    assumed: "All transformer taps at neutral (ratio = published rated voltages)."
    why: "Tap positions and AVC set-points are not published. Grid transformers operate under automatic voltage control in reality."
    affects: "3 × 132/33 kV grid transformers, 12 × 33/11 kV primary transformers"
    sensitivity_risk: >-
      MEDIUM for voltage magnitudes (real 33 kV busbar is regulated, model voltage drops
      under load), LOW for active-power flows (radial/parallel paths with identical units).

  A03_no_magnetising_branch:
    assumed: "Transformer no-load losses and magnetising current = 0."
    why: "Not published in LTDS T2a."
    affects: "all transformers"
    sensitivity_risk: "LOW (well below 1% of throughput)."

  A04_zero_phase_shift:
    assumed: "Vector-group phase shifts (YNd1, Dyn11) are not modelled (shift = 0)."
    why: >-
      Positive-sequence balanced PF. Parallel transformers in every modelled loop share the
      same vector group, so no circulating current is created by omitting the shift.
    affects: "bus voltage angles only"
    sensitivity_risk: "NONE for P/Q flows in this topology; angles are relative."

  A05_external_grid_sundon_gis_132kv:
    assumed: "Slack = Sundon GIS 132 kV busbar (EPN:SUND11 with SUND12 coupled), |V| = 1.00 pu, angle 0."
    why: >-
      Sundon is itself the Grid Supply Point: the 132 kV GIS busbar is the transmission/
      distribution boundary through which all Sundon 33 kV demand is supplied (LTDS 132 kV
      circuits SUG1_SUG1_1..3 connect the three grid transformers to it). Everything upstream
      (NGET 400/132 kV SGTs, other 132 kV circuits from Sundon) is outside the model.
      The busbar voltage set-point is not published.
    affects: "boundary; voltage reference"
    sensitivity_risk: "LOW for flows; voltage magnitudes shift with the set-point."

  A06_sundon_132kv_coupler_closed:
    assumed: "Sundon GIS 132 kV busbar sections SUND11 and SUND12 are coupled (closed bus coupler)."
    why: "No LTDS branch links them; busbar running arrangement not published. GT2 connects to SUND12, GT1/GT3 to SUND11."
    affects: "GT2 vs GT1/GT3 load sharing"
    sensitivity_risk: "LOW–MEDIUM; tested by E2 per-transformer import split (observed via GT and SUG1 meters)."

  A07_load_power_factor_ltds_3a:
    assumed: "Load Q = P·tan(acos(pf)) with pf = LTDS Table 3a maximum_demand_24_25_pf for the site and season (Winter = Nov–Mar, Summer = Apr–Oct)."
    why: "Reactive power is not published in operational data."
    affects: "all loads"
    sensitivity_risk: "LOW for P flows, MEDIUM for currents and voltages."

  A08_season_mapping:
    assumed: "Summer ratings used for loading checks; Winter = Nov–Mar for power factors."
    why: "UKPN does not publish the season boundaries in these datasets."
    affects: "loading %, load Q"
    sensitivity_risk: "LOW"

  A09_unobserved_customer_injection:
    assumed: >-
      V0: unobserved 33 kV customers (49.5 MW battery, 41 MW PV, 1.5 MW wind per ECR) inject 0.
      V1: their aggregate net injection = observed Sundon import − modelled import (DERIVED
      residual), split equally between the candidate connection nodes of the scenario.
    why: >-
      Their output is not published (the circuit carrying the tee-connected customers is
      redacted in 25/37 months). Their exact connection nodes are not identifier-linked:
      ECR site FLOC points to Leighton Buzzard, LTDS Table 5 to Sundon 33 kV, and LTDS has
      generic customer tee nodes (EPN 0317, EPN 0158) without names.
    affects: "Leighton Buzzard group circuits; total import"
    sensitivity_risk: "HIGH for the Leighton Buzzard group; tested by comparing V1 placements."

  A10_current_derived_load:
    assumed: "Where a primary transformer publishes current only, P = √3·Vn·I·pf (Vn = 11 kV, |V| = 1 pu), as demand (HV→LV)."
    why: "Chaul End and Lewsey transformers publish current but not active power."
    affects: "Chaul End (CHAU51, CHAU52), Lewsey (LEWS51)"
    sensitivity_risk: "MEDIUM: ±(pf, voltage) error; sign cannot reverse under export (Lewsey has 2 MW standby oil)."
