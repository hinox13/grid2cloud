schema: cloud2grid E5d checkpoint registry v1
frozen: true
frozen_before_real_state_evaluation: true
selection_rule:
  candidates: λ ∈ {0.3, 1, 3} runs (the λ = 0 code-path control is reported, not selectable)
  step_1: eligible = synthetic_gate.pass
  step_2: among eligible, lowest PBE on the FULL E5c validation pool (9,353 states)
  step_3: tie range = within 10 % of the best → prefer the λ configuration whose seeds
    are most stable (smallest CV of validation-pool PBE; single-seed configurations
    rank after the 3-seed λ = 1), then λ closest to 1 (|log λ|), then the lower validation-pool
    PBE
  fallback_if_none_eligible: rank all candidates lexicographically by (static pass,
    pv response pass [RS1–RS5 pv], battery + load response pass, retention pass, number
    of the 23 criteria passed) descending, then validation-pool PBE ascending. The
    selection is FLAGGED and the verdict cannot be E5D-A.
  then: FREEZE (sha256 of weights, normalizer, response-loss scales, graphkit configs,
    E5d configs, pair manifests, selection table) in metadata/e5d_checkpoint_registry.yaml
    and COMMIT before any real-state file is opened. predict on real targets is refused
    by code until then.
