# Cloud2Grid Explorer — manual ELECTRICAL SCHEMATIC of the Sundon 33 kV network (GENCO graph,
# 37 buses). Not geographic: x/y carry no location meaning. Read by scripts/build_demo_events.py
# (every GENCO bus must appear here exactly once).
#
# Rows encode the voltage hierarchy, top to bottom:
#   132 kV grid supply (SUND11, SUND12 merged) → 132 kV GT terminals → 33 kV GT terminals →
#   SUND31 33 kV busbar → 33 kV feeder row → 11 kV primary busbars (loads).
# Left: Sundon, Lewsey and Chaul End primaries (radial). Centre: battery customer CHAP31 and
# the LBUZ33 feeder. Right: the 33 kV ring SUND31 – GFSF3A – MRFM3C – MRFM3A – MRFM3B – LBUZ3D –
# LBUZ32 – (LBUZ51 11 kV) – LBUZ31 – LBUZ3C – SUND31, drawn as a rectangle.

bands:   # background voltage bands (y ranges) and their labels
  - {label: "132 kV", y0: 2.75, y1: 4.45}
  - {label: "33 kV", y0: -0.45, y1: 2.75}
  - {label: "11 kV", y0: -1.45, y1: -0.45}

# Busbars are drawn as horizontal bars: every branch attached to them drops vertically from the
# bar at the other end's x. Electrically they remain ONE node each (SUND11 incl. SUND12; SUND31).
busbars:
  EPN:SUND11: {y: 4.0}
  EPN:SUND31: {y: 1.45}

nodes:
  # 132 kV
  EPN:SUND11: [0.0, 4.0]      # grid supply point (REF), SUND12 coupled
  EPN:SUND1A: [-0.9, 3.15]
  EPN:SUND1B: [0.0, 3.15]
  EPN:SUND1C: [0.9, 3.15]
  # 33 kV — grid transformer LV terminals and main busbar
  EPN:SUND3A: [-0.9, 2.3]
  EPN:SUND3B: [0.0, 2.3]
  EPN:SUND3C: [0.9, 2.3]
  EPN:SUND31: [0.0, 1.45]
  # 33 kV feeder row — radial primaries (left)
  EPN:SUPR31: [-6.6, 0.3]
  EPN:SUPR32: [-6.0, 0.3]
  EPN:SUPR33: [-5.2, 0.3]
  EPN:SUPR34: [-4.6, 0.3]
  EPN:LEWS31: [-3.8, 0.3]
  EPN:LEWS32: [-3.2, 0.3]
  EPN:CHAU31: [-2.4, 0.3]
  EPN:CHAU32: [-1.8, 0.3]
  EPN:CHAU33: [-1.15, 0.3]
  # centre: battery customer and the LBUZ33 feeder
  EPN:CHAP31: [-0.35, 0.3]
  EPN:LBUZ33: [0.6, 0.3]
  # right: 33 kV ring (bottom edge on the feeder row, top edge above it)
  EPN:LBUZ3C: [1.35, 0.3]
  EPN:LBUZ31: [2.1, 0.3]
  EPN:LBUZ32: [3.3, 0.3]
  EPN:LBUZ3D: [3.9, 0.3]
  EPN:MRFM3B: [4.6, 0.3]
  EPN:MRFM3A: [4.6, 1.0]
  EPN:MRFM3C: [3.25, 1.0]
  EPN:GFSF3A: [1.95, 1.0]
  EPN:GFSF31: [2.55, 1.6]     # spur
  EPN:MFES31: [5.4, 1.0]      # spur
  # 11 kV primary busbars (loads)
  EPN:SUPR52: [-6.3, -1.0]
  EPN:SURP5A: [-5.2, -1.0]
  EPN:SURP5B: [-4.6, -1.0]
  EPN:LEWS51: [-3.5, -1.0]
  EPN:CHAU51: [-2.1, -1.0]
  EPN:CHAU52: [-1.15, -1.0]
  EPN:LBUZ5A: [0.6, -1.0]
  EPN:LBUZ51: [2.7, -1.0]

groups:  # captions (x, y); <br> breaks lines
  - {label: "Sundon<br>primary", x: -5.6, y: -1.33}
  - {label: "Lewsey<br>primary", x: -3.5, y: -1.33}
  - {label: "Chaul End<br>primary", x: -1.65, y: -1.33}
  - {label: "Leighton Buzzard<br>primary", x: 1.65, y: -1.33}
  - {label: "Battery<br>CHAP31", x: -0.35, y: -0.12}
  - {label: "Grid supply · Sundon 132 kV", x: 0.0, y: 4.3}
  - {label: "Sundon 33 kV busbar", x: -6.75, y: 1.62, anchor: left}
  - {label: "33 kV ring", x: 3.25, y: 1.25}
