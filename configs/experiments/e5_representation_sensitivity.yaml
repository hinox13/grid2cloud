# E5 — representation sensitivity of the near-zero-impedance area (before any fine-tuning).
# PRE-REGISTERED 2026-10-06, before the equivalence test is run and before any E5 GENCO run.
# E4 frozen at commit 0f3101b. The merge rule and tolerances below are physical / pipeline-based;
# NOTHING here is chosen from GENCO performance.

experiment_id: e5_representation_sensitivity

representations:
  SUNDON_ORIGINAL:
    definition: E1/E2 network exactly as used in E4 (every LTDS circuit is a branch)
    role: primary (unless the analysis shows the original graph is not the appropriate
      electrical representation)
  SUNDON_MERGED_NEAR_ZERO_Z:
    role: sensitivity only — eligible ONLY if physically defensible AND AC-equivalent
    merge_rule:
      criterion: >-
        a non-transformer branch whose LTDS series impedance |r + jx| <= 5.0e-4 pu on 100 MVA,
        i.e. R and X each within 1–3 quanta of LTDS's printed 0.01 % (= 1e-4 pu) resolution.
        Such values are at the publication's quantisation floor: the true impedance is not
        known to better than ±50 % of its value, so the branch carries no reliable electrical
        information beyond "a direct connection".
      both_ends_same_nominal_voltage: true
      expected_branches: [SU33_SU11_4, SUG1_SUG1_1, SUG1_SUG1_2, SUG1_SUG1_3]   # verified in code
      not_merged_by_rule: "next-smallest branch is |z| = 7.6e-4 pu (Lne_NESD_T1): rule does not
        stretch to it"
    method:
      - replace each merged line by a closed bus–bus switch (pandapower fuses the two buses into
        one electrical node, as it already does for the SUND11–SUND12 coupler)
      - preserve the line's total shunt charging as a shunt at the fused node
        (q_mvar = −vn_kv² · ω · C_total), so reactive balance is kept
      - loads, generators, transformers and every other branch unchanged
      - >-
        an observed outage of a merged line (E2 outage detection runs on the original network)
        opens its switch and removes its charging — the same topology as the original state.
        Added 2026-10-06 BEFORE any equivalence result: E2 detects SUG1_SUG1_3 out on some days
        (e.g. 2024-09-01), which the first implementation refused.
    applies_to: every state family (same states, re-exported in the merged representation)

equivalence_test:        # merged vs original AC solution, same states, pandapower AC PF
  populations:
    - S1_WEATHER_ALIGNED (all 2,829 E4 states, interpretation sundon_capacity_scaled_with_outages)
    - E1 planning-peak case, intact, loads × [1.0, 1.25, 1.5, 1.75, 2.0] (covers the S0 regime)
  compare_on: buses and branches present in BOTH representations (merged nodes compared with
    the corresponding original bus that keeps the node's name; removed branches excluded)
  tolerances:
    max_abs_dVm_pu: 1.0e-3        # = the E4 AC gate max_solver_disagreement_vm_pu
    max_abs_dVa_deg: 1.0e-2
    max_abs_dP_branch_mw: 5.0e-2  # ≈ 1/20 of the E2 core-circuit MAE vs measurement (0.94 MW):
    max_abs_dQ_branch_mvar: 5.0e-2  #   below what the validation pipeline can resolve
    max_abs_d_slack_p_mw: 5.0e-2
    max_abs_d_slack_q_mvar: 5.0e-2
    merged_power_balance_mva: 1.0e-3   # the E4 AC gate, in the merged representation
  verdict: "AC_EQUIVALENT if every tolerance holds on every state; otherwise REJECTED (reported)"

after_adaptation:        # only if SUNDON_MERGED_NEAR_ZERO_Z is AC_EQUIVALENT (see e5_topology_adaptation.yaml)
  cells: [zero_shot_original, zero_shot_merged, adapted_original, adapted_merged]
  adapted_merged: >-
    same recipe, training size and seed as the frozen primary checkpoint, trained on the SAME
    datakit seeds generated on the merged case; evaluated on the merged S1 states
  questions:
    - "How much error is representation? (merged − original, at fixed adaptation)"
    - "How much error is lack of topology adaptation? (adapted − zero-shot, at fixed representation)"
  note: never mixed with the learning-curve result; never used to pick the primary representation

conditioning_diagnostic:   # metric stiffness, reported (no decision)
  - PBE of the exact AC solution evaluated in float32 (GENCO's arithmetic) vs float64
  - dP/dθ (MW per radian) of each near-zero-Z branch
