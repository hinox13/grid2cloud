<!doctype html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cloud2Grid</title>
    <meta name="description" content="One cloud, one grid, a chain of consequences: real Meteosat observations of 15 June 2024 drive a reconstructed UK electricity network, a grid foundation model learns its response, and the result is valued at historical prices." />
    <meta name="theme-color" content="#050f16" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050f16'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23ff7a1f'/%3E%3C/svg%3E" />
    <link rel="preload" href="data/claims.json" as="fetch" crossorigin />
    <link rel="preload" href="data/events/jun15_cloud_clearing/event.json" as="fetch" crossorigin />
    <link rel="preload" href="data/events/jun15_cloud_clearing/frames/frame_009.webp" as="image" />
    <script>
      // theme before first paint (no flash); the app keeps it in sync afterwards
      try {
        var s = localStorage.getItem("c2g-theme");
        var t = s === "light" || s === "dark" ? s : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Cloud2Grid is an interactive site and needs JavaScript. The research, data and verification are at https://github.com/hinox13/grid2cloud.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
